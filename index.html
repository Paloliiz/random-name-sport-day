<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมสุ่มสี กีฬาสีครู (แบบสุ่มทีละสี)</title>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .main-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(46, 204, 113, 0.4);
            transition: all 0.3s ease;
            font-family: 'Sarabun', sans-serif;
        }
        .main-btn:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }
        .main-btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        
        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .team-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            opacity: 0.5;
            transition: all 0.5s ease;
            transform: scale(0.95);
            min-height: 400px;
        }
        .team-card.active {
            opacity: 1;
            transform: scale(1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .team-card.revealed {
            opacity: 1;
            transform: scale(1);
            border: 2px solid #ddd;
        }

        .team-header {
            padding: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .team-header.red { background-color: #e74c3c; color: white; }
        .team-header.blue { background-color: #3498db; color: white; }
        .team-header.yellow { background-color: #f1c40f; color: #333; }
        .team-header.orange { background-color: #e67e22; color: white; }
        
        .team-stats {
            text-align: center;
            padding: 10px;
            background-color: #f1f2f6;
            font-size: 14px;
            color: #555;
            border-bottom: 1px solid #eee;
            font-weight: bold;
            display: none;
        }
        .team-card.revealed .team-stats {
            display: block;
            animation: fadeIn 1s;
        }

        .member-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .member-list li {
            padding: 10px 15px;
            border-bottom: 1px dashed #eee;
            font-size: 15px;
            text-align: center;
        }
        .member-list li:last-child {
            border-bottom: none;
        }
        
        .revealed .gender-m { color: #2980b9; font-weight: 600; }
        .revealed .gender-f { color: #8e44ad; font-weight: 600; }
        
        .animating-list li {
            color: #7f8c8d;
            font-style: italic;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes pulseAlert {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .pulsing {
            animation: pulseAlert 0.3s infinite;
        }

        .waiting-text {
            text-align: center;
            padding: 50px 20px;
            color: #bdc3c7;
            font-size: 40px;
        }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎲 โปรแกรมสุ่มแบ่งสีครู</h1>
        <p style="color: #666; margin-top: -15px; margin-bottom: 20px;">จัดสรรชาย-หญิง คละกันเท่าๆ กัน</p>
        <button id="actionBtn" class="main-btn" onclick="startNextReveal()">เตรียมพร้อมสุ่มสีแรก!</button>
    </div>
    
    <div class="teams-grid" id="teamsContainer">
        <!-- การ์ดทั้ง 4 สีจะถูกวาดที่นี่ -->
    </div>
</div>

<script>
    // ข้อมูลรายชื่อที่อัปเดต (ลบครูฆฤณพิสิฎฐ์ และ ครูบุญมั่น ออกแล้ว)
    const rawData = `นาง สิริขวัญ บุญแจ้ง
นาง นวลฉวี เชิดฉิน
นาง พวงเพ็ญ แพนลา
นาง ปุณณภา เจนธนยุทธ์
นาง บุษวรรณ เชื้อชะเอม
นาง จันทนา รสชุ่ม
นาย กิตติกร เชื้อชะเอม
นาง วาสนา ชมภูโคตร
นางสาว ฉันทนา กองจันดา
นาย ปัทม์ มกรวานิชย์
นางสาว สุกันญา จันทร์สมร
นาย จิตติภัส ขวัญส่ง
นางสาว สิริกร พืชนะผล
นาง ธฤษวรรณ นาทีชัยชนะ
นาง ฐิติรัตน์ ฉุนกระโทก
นางสาว ดาริกา มงคลใหม่
นางสาว ดวงใจ เจริญทรัพย์
นาย สิรสิทธิ์ บู่ทอง
นาง ลัดดาวรรณ แก้วพวง
นาย ศักดิ์นิรัญ ภูวะลี
นาย ราเมศ กกรัมย์
นางสาว เสาวลักษณ์ กิตติชาติมณีกุล
นาย เฉลิมชัย วารี
นางสาว สุรีย์ เชื้อวงษ์
นาย โกวิทย์ วิเศษศักดิ์
นางสาว ดัชนี คงทันดี
นาง สมร แก่นจันทร์ใบ
นาย นิรันดร์ ประเสริฐศิริรัตน์
นาง อรุชา ปิยะมิตรบัณฑิต
นางสาว ชฎาพร ทองขาว
นางสาว วิภาพร สมนึก
นาง ไอริณ กกรัมย์
นางสาว ศรุตา จันทเกตุ
นาย รัฐศาสตร์ ใจสัตย์
นาย นิตชัย วรรณทะมาศ
นางสาว สุภาพร ภูผาย
นางสาว สุดารัตน์ ทาปลัด
นาย พิทักษ์ ศิลารักษ์
นาง นุจรีพร เย็นดี
นาย บริวัตร ราชสีห์
นาย ประจักรศิลป์ แก่นจันทร์ใบ
นางสาว กัญญาพัชร ยินดี
นางสาว ธิดารัตน์ ใจบุญ
นางสาว จิตสุภา ถาวรกุล
นางสาว พัชราภรณ์ บาลลา
นางสาว ณัฐวิกรานต์ โพธิ์สำนัก
นาย ธีรศักดิ์ สิทฺธิปลื้ม
นางสาว ปรียานุช นาคสวัสดิ์
นางสาว ศศิธร เอี่ยวเฮ็ง`;

    let precalculatedTeams = [];
    let allTeacherNames = [];
    let currentStep = 0; 
    const teamConfig = [
        { id: 'red', name: '🔴 สีแดง' },
        { id: 'blue', name: '🔵 สีฟ้า' },
        { id: 'yellow', name: '🟡 สีเหลือง' },
        { id: 'orange', name: '🟠 สีส้ม' }
    ];

    // รายชื่อที่ต้องการล็อคให้อยู่สีแดง (ใช้เฉพาะชื่อเพื่อป้องกันปัญหาตัวสะกด/คำนำหน้า)
    const lockedToRed = ["สุดารัตน์", "ศรุตา", "ธีรศักดิ์"];

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function calculateTeams() {
        const teachers = rawData.split('\n')
            .map(t => {
                let parts = t.trim().split(/\s+/);
                if (parts.length >= 3) {
                    return `${parts[0]} ${parts[1]} ${parts[2]}`;
                }
                return t.trim();
            })
            .filter(t => t !== '');
            
        allTeacherNames = teachers; 
        
        precalculatedTeams = teamConfig.map((c, index) => ({
            ...c, members: [], mCount: 0, fCount: 0, originalIndex: index
        }));

        let poolMales = [];
        let poolFemales = [];

        // แยกรายชื่อคนที่ถูกล็อค และคนที่เหลือ
        teachers.forEach(t => {
            let isLocked = lockedToRed.some(lockedName => t.includes(lockedName));
            let isMale = t.startsWith('นาย');

            if (isLocked) {
                // ใส่สีแดง (index 0) ทันที
                precalculatedTeams[0].members.push({ name: t, gender: isMale ? 'm' : 'f' });
                if (isMale) precalculatedTeams[0].mCount++;
                else precalculatedTeams[0].fCount++;
            } else {
                // ใส่ตะกร้ารอสุ่ม
                if (isMale) poolMales.push(t);
                else poolFemales.push(t);
            }
        });

        // สุ่มคนที่เหลือในตะกร้า
        poolMales = shuffle(poolMales);
        poolFemales = shuffle(poolFemales);

        // ระบบ Auto-Balance ผู้ชาย: เช็คว่าทีมไหนผู้ชายน้อยที่สุด ให้ใส่ทีมนั้นก่อน
        poolMales.forEach(person => {
            precalculatedTeams.sort((a, b) => a.mCount - b.mCount);
            precalculatedTeams[0].members.push({ name: person, gender: 'm' });
            precalculatedTeams[0].mCount++;
        });

        // ระบบ Auto-Balance ผู้หญิง: เช็คว่าทีมไหนผู้หญิงน้อยที่สุด ให้ใส่ทีมนั้นก่อน
        poolFemales.forEach(person => {
            precalculatedTeams.sort((a, b) => a.fCount - b.fCount);
            precalculatedTeams[0].members.push({ name: person, gender: 'f' });
            precalculatedTeams[0].fCount++;
        });

        // คืนค่าลำดับทีมให้กลับมาเป็น แดง, ฟ้า, เหลือง, ส้ม เหมือนเดิม
        precalculatedTeams.sort((a, b) => a.originalIndex - b.originalIndex);

        // สับเปลี่ยนลำดับคนภายในทีมอีกครั้ง (เพื่อให้คนที่โดนล็อคไม่กองอยู่บรรทัดแรก)
        precalculatedTeams.forEach(team => {
            team.members = shuffle(team.members);
        });
    }

    function initUI() {
        calculateTeams();
        currentStep = 0;
        document.getElementById('actionBtn').innerText = `▶️ เริ่มสุ่ม ${teamConfig[0].name}`;
        
        const container = document.getElementById('teamsContainer');
        container.innerHTML = '';
        
        precalculatedTeams.forEach(team => {
            container.innerHTML += `
                <div class="team-card" id="card-${team.id}">
                    <div class="team-header ${team.id}">${team.name}</div>
                    <div class="team-stats" id="stats-${team.id}"></div>
                    <ul class="member-list" id="list-${team.id}">
                        <div class="waiting-text">?</div>
                    </ul>
                </div>
            `;
        });
    }

    function getRandomNames(count) {
        let randomNames = [];
        for(let i=0; i<count; i++) {
            randomNames.push(allTeacherNames[Math.floor(Math.random() * allTeacherNames.length)]);
        }
        return randomNames;
    }

    function startNextReveal() {
        if (currentStep >= 4) {
            initUI(); 
            return;
        }

        const btn = document.getElementById('actionBtn');
        btn.disabled = true;
        btn.innerText = "⏳ กำลังสุ่ม...";

        const team = precalculatedTeams[currentStep];
        const cardDOM = document.getElementById(`card-${team.id}`);
        const listDOM = document.getElementById(`list-${team.id}`);
        
        cardDOM.classList.add('active', 'pulsing');
        listDOM.classList.add('animating-list');

        let memberCount = team.members.length;
        let animationDuration = 2500; 
        let speed = 80; 
        
        let interval = setInterval(() => {
            let fakeNames = getRandomNames(memberCount);
            let html = '';
            fakeNames.forEach(name => {
                html += `<li>${name}</li>`;
            });
            listDOM.innerHTML = html;
        }, speed);

        setTimeout(() => {
            clearInterval(interval);
            
            cardDOM.classList.remove('pulsing');
            listDOM.classList.remove('animating-list');
            cardDOM.classList.add('revealed');
            
            let html = '';
            team.members.forEach(member => {
                let colorClass = member.gender === 'm' ? 'gender-m' : 'gender-f';
                html += `<li class="${colorClass}">${member.name}</li>`;
            });
            listDOM.innerHTML = html;

            const statsDOM = document.getElementById(`stats-${team.id}`);
            statsDOM.innerHTML = `รวม ${memberCount} คน (ชาย ${team.mCount} / หญิง ${team.fCount})`;

            currentStep++;
            btn.disabled = false;

            if (currentStep < 4) {
                btn.style.backgroundColor = getTeamColorCode(precalculatedTeams[currentStep].id);
                btn.innerText = `▶️ สุ่มสีต่อไป (${precalculatedTeams[currentStep].name})`;
            } else {
                btn.style.backgroundColor = '#34495e';
                btn.innerText = `🔄 รีเซ็ตและเริ่มสุ่มใหม่`;
            }

        }, animationDuration);
    }

    function getTeamColorCode(id) {
        if(id==='red') return '#e74c3c';
        if(id==='blue') return '#3498db';
        if(id==='yellow') return '#f39c12';
        if(id==='orange') return '#e67e22';
        return '#2ecc71';
    }

    window.onload = initUI;
</script>

</body>
</html>
